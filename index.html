<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Pages 示例项目</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 24px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #4ade80;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Cloudflare Pages Demo</span>
    <h1>🚀 项目部署成功！</h1>
    <p>这是一个运行在 Cloudflare 全球边缘网络上的测试页面。你的 pages.dev 域名已经可以正常访问了。</p>
    <button class="btn" onclick="testAction()">测试点击交互</button>
    <div id="status" class="status">✓ 脚本运行正常！页面响应良好。</div>
  </div>

  <script>
    function testAction() {
      document.getElementById('status').style.display = 'block';
    }
  </script>
</body>
</html>
